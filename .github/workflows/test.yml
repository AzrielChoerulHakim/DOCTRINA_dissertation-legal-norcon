name: DOCTRINA regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run v0.3 and v0.4 regression suites
        run: python -m unittest discover -s tests -v
      - name: Smoke test local-only draft intake
        run: |
          python scripts/doctrina_cli.py init --input examples/dissertation-draft-synthetic.txt --object concept --title "Kepentingan umum" --locus "simulasi" --out /tmp/doctrina-case.json
          python scripts/doctrina_cli.py check /tmp/doctrina-case.json --out /tmp/doctrina-audit.json
          python scripts/doctrina_cli.py report /tmp/doctrina-case.json --out /tmp/doctrina-review.md
      - name: PILOT-002 published dissertation mechanical review (NOT a legal verdict)
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path[:0] = ["scripts", "tests"]
          from doctrina_core import review
          from test_pilot_gutierrez_2021 import build_pilot_case
          result = review(build_pilot_case())
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result["gate"] == "INTERNAL_REVISION_REQUIRED"
          assert result["originality"].startswith("LOCKED")
          PY
      - name: Reproducible P003-P009 case audits
        run: python scripts/run_dissertation_batch.py --out-dir /tmp/doctrina-batch
      - name: Upload batch machine reports
        uses: actions/upload-artifact@v4
        with:
          name: doctrina-batch-p003-p009
          path: /tmp/doctrina-batch/
          if-no-files-found: error

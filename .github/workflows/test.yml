name: DOCTRINA regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-verification dependencies
        run: python -m pip install 'pypdf>=4,<8' 'reportlab>=4,<6'
      - name: Run v0.3, v0.4 and v0.4.1 regression suites
        run: python -m unittest discover -s tests -v
      - name: P1 original-draft, multi-voice and conditional reconstruction smoke
        run: |
          python scripts/demo_fidelity.py --out /tmp/doctrina-p1-demo.json
          python scripts/fidelity_cli.py check --case /tmp/doctrina-p1-demo.json --draft examples/fidelity_draft_synthetic.txt --format markdown --out /tmp/doctrina-p1-report.md
          python scripts/doctrina_cli.py check /tmp/doctrina-p1-demo.json --original-draft examples/fidelity_draft_synthetic.txt --out /tmp/doctrina-p1-core-audit.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/doctrina-p1-core-audit.json', encoding='utf-8'))
          assert data['fidelity']['gate'] == 'RESEARCHER_REVIEW_REQUIRED'
          assert data['fidelity']['counts']['confirmed'] == 0
          assert data['originality'].startswith('LOCKED')
          PY
      - name: Smoke test local-only draft intake
        run: |
          python scripts/doctrina_cli.py init --input examples/dissertation-draft-synthetic.txt --object concept --title "Kepentingan umum" --locus "simulasi" --out /tmp/doctrina-case.json
          python scripts/doctrina_cli.py check /tmp/doctrina-case.json --out /tmp/doctrina-audit.json
          python scripts/doctrina_cli.py report /tmp/doctrina-case.json --out /tmp/doctrina-review.md
      - name: PILOT-002 published dissertation mechanical review (NOT a legal verdict)
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path[:0] = ["scripts", "tests"]
          from doctrina_core import review
          from test_pilot_gutierrez_2021 import build_pilot_case
          result = review(build_pilot_case())
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result["gate"] == "INTERNAL_REVISION_REQUIRED"
          assert result["originality"].startswith("LOCKED")
          PY
      - name: Reproducible P003-P009 case audits
        run: python scripts/run_dissertation_batch.py --out-dir /tmp/doctrina-batch
      - name: Upload batch machine reports
        uses: actions/upload-artifact@v4
        with:
          name: doctrina-batch-p003-p009
          path: /tmp/doctrina-batch/
          if-no-files-found: error
      - name: Verify pinned official thesis and court PDFs; report blocked other repositories
        id: source_originals
        continue-on-error: true
        run: python scripts/verify_published_sources_ci.py --out-dir /tmp/doctrina-source-discovery
      - name: Upload source-verification results (NO original PDF bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrina-source-discovery
          path: |
            /tmp/doctrina-source-discovery/source-discovery-report.json
            /tmp/doctrina-source-discovery/proposed-source-pins.json
          if-no-files-found: warn
